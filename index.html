<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive F</title>
    <style>
        /* Reset and center everything vertically and horizontally */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            user-select: none; /* Prevents accidental text selection highlighting */
        }

        /* Flex container to stack the F and the image vertically with plenty of space */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px; /* Generous spacing between the F and the image */
            text-align: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Styling for the sleek, thin letter F */
        #letter {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 100; /* Ultra-thin variant */
            font-size: 80px;
            color: #000000;
            line-height: 1.2; /* Extra line-height headroom to prevent vertical clipping */
            height: 80px;     /* Explicit height matching your 80px requirement */
            transition: color 0.1s ease; /* Snappy color transition */
        }

        /* Styling for your uploaded image scaled down to half size */
        #display-image {
            max-width: 50%; /* Scales the image to half the container's width */
            height: auto;
            display: block;
        }

        /* Class to trigger the red color change */
        .turn-red {
            color: #ff0000 !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="letter">F</div>
        <img id="display-image" src="img.jpeg" alt="Uploaded Image">
    </div>

    <script>
        // Listen for keyboard input across the entire page
        document.addEventListener('keydown', function(event) {
            // Check if the pressed key is 'f' or 'F'
            if (event.key === 'f' || event.key === 'F') {
                const letterDiv = document.getElementById('letter');
                letterDiv.classList.add('turn-red');
            }
        });
    </script>

</body>
</html>
