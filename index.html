<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive F with Image</title>
    <style>
        /* Reset and center everything vertically and horizontally */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            overflow: hidden;
            user-select: none; /* Prevents accidental selection highlighting */
        }

        /* Flex container to stack the F and the image vertically */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; /* Space between the F and the image */
            /* Smooth fade-out transition for the whole block */
            transition: opacity 0.2s ease;
            opacity: 1;
        }

        /* Styling for the sleek, thin letter F */
        #letter {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 100;
            font-size: 80px;
            color: #000000;
            line-height: 1;
        }

        /* Styling for your uploaded image */
        #display-image {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Class to trigger disappearance */
        .hidden {
            opacity: 0 !important;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="interactive-content" class="container">
        <div id="letter">F</div>
        <img id="display-image" src="img.png" alt="Uploaded Image">
    </div>

    <script>
        // Listen for keyboard input across the entire page
        document.addEventListener('keydown', function(event) {
            // Check if the pressed key is 'f' or 'F'
            if (event.key === 'f' || event.key === 'F') {
                const content = document.getElementById('interactive-content');
                content.classList.add('hidden');
            }
        });
    </script>

</body>
</html>
